<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rubik's Cube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Space scene is dark in both themes, so one palette serves light and dark. */
:root {
  --bg:#070A18; --ink:#E8ECF4; --muted:#A3AEC4; --panel:rgba(30,38,66,.55); --line:rgba(160,175,215,.28); --good:#6EE7A0;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*, *::before, *::after { box-sizing:inherit; }
html { height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body {
  height:100%; margin:0; color:var(--ink);
  background:
    radial-gradient(ellipse 60% 45% at 18% 22%, rgba(120,70,200,.35), transparent 70%),
    radial-gradient(ellipse 55% 40% at 85% 75%, rgba(30,120,200,.30), transparent 70%),
    radial-gradient(ellipse 40% 30% at 70% 15%, rgba(200,70,140,.18), transparent 70%),
    var(--bg);
  font-family:Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  display:flex; flex-direction:column;
}
header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:16px 20px 0; }
h1 { font-size:1.5rem; font-weight:700; margin:0; letter-spacing:-0.01em; }
#status { color:var(--muted); font-size:.95rem; text-align:right; }
#status.solved { color:var(--good); font-weight:500; }
#stage { flex:1; min-height:240px; position:relative; }
#stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
#stage canvas:active { cursor:grabbing; }
.controls { padding:0 16px 16px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.row { display:flex; gap:8px; justify-content:center; }
button {
  font:inherit; font-size:.95rem; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:10px; padding:10px 18px; cursor:pointer;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
button:hover { border-color:var(--ink); }
button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:500; }
button:focus-visible { outline:3px solid #2D7FF9; outline-offset:2px; }
.pad { display:grid; grid-template-columns:repeat(6, minmax(40px, 1fr)); gap:6px; width:100%; max-width:420px; }
.pad button { padding:8px 0; font-weight:500; }
.help { color:var(--muted); font-size:.85rem; line-height:1.45; text-align:center; max-width:60ch; margin:0; }
</style>
</head>
<body>
<header>
  <h1>Rubik's Cube</h1>
  <div id="status" aria-live="polite">Solved. Press Scramble to start.</div>
</header>
<div id="stage"></div>
<div class="controls">
  <div class="row">
    <button class="primary" id="scramble">Scramble</button>
    <button id="reset">Reset</button>
  </div>
  <div class="pad" id="pad" aria-label="Face turns"></div>
  <p class="help">Drag a face to turn it. Drag the background to look around. Keys U D L R F B turn faces; hold Shift to turn the other way.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V3 = THREE.Vector3, Q = THREE.Quaternion;
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// --- Scene ---
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x3a2a55, 0.75));
const light = new THREE.DirectionalLight(0xffffff, 0.7);
light.position.set(4, 6, 8);
scene.add(light);
const rim = new THREE.DirectionalLight(0x8fb4ff, 0.35);
rim.position.set(-6, -2, -5);
scene.add(rim);

// --- Starfield ---
function starTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.25, 'rgba(255,255,255,.6)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const stars = new THREE.Group();
const tex = starTexture();
const tints = [0xffffff, 0xcfe0ff, 0xffe6c7, 0xd9c8ff];
for (const [count, size] of [[1400, 0.35], [300, 0.7], [60, 1.2]]) {
  const pts = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const v = new V3().randomDirection ? new V3().randomDirection() : new V3(Math.random()-.5, Math.random()-.5, Math.random()-.5).normalize();
    v.multiplyScalar(40 + Math.random() * 40);
    pts.set([v.x, v.y, v.z], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  stars.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size, map:tex, color:tints[Math.floor(Math.random() * tints.length)],
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  })));
}
scene.add(stars);

const root = new THREE.Group();
root.quaternion.setFromEuler(new THREE.Euler(0.45, -0.65, 0, 'XYZ'));
scene.add(root);

// --- Cube ---
const COLORS = { U:0xffffff, D:0xffd500, F:0x009b48, B:0x0046ad, R:0xb71234, L:0xff5800 };
const FACES = [['R',[1,0,0]],['L',[-1,0,0]],['U',[0,1,0]],['D',[0,-1,0]],['F',[0,0,1]],['B',[0,0,-1]]];
const AX = { x:new V3(1,0,0), y:new V3(0,1,0), z:new V3(0,0,1) };
const IDX = { x:0, y:1, z:2 };

function roundedSquare(w, r) {
  const h = w / 2, s = new THREE.Shape();
  s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.quadraticCurveTo(h, -h, h, -h + r);
  s.lineTo(h, h - r); s.quadraticCurveTo(h, h, h - r, h);
  s.lineTo(-h + r, h); s.quadraticCurveTo(-h, h, -h, h - r);
  s.lineTo(-h, -h + r); s.quadraticCurveTo(-h, -h, -h + r, -h);
  return new THREE.ShapeGeometry(s, 4);
}
// Box with rounded edges: push each vertex out from an inner box by radius r.
function roundedBox(size, r, seg) {
  const g = new THREE.BoxGeometry(1, 1, 1, seg, seg, seg);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const inner = size / 2 - r, p = new V3(), c = new V3(), n = new V3();
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i).multiplyScalar(size);
    c.set(THREE.MathUtils.clamp(p.x, -inner, inner), THREE.MathUtils.clamp(p.y, -inner, inner), THREE.MathUtils.clamp(p.z, -inner, inner));
    n.subVectors(p, c).normalize();
    p.copy(c).addScaledVector(n, r);
    pos.setXYZ(i, p.x, p.y, p.z);
    nor.setXYZ(i, n.x, n.y, n.z);
  }
  return g;
}
const bodyGeo = roundedBox(0.95, 0.12, 8);
const bodyMat = new THREE.MeshStandardMaterial({ color:0x16161c, roughness:0.45, metalness:0.1 });
const stickerGeo = roundedSquare(0.78, 0.16);
const mats = {};
for (const k in COLORS) mats[k] = new THREE.MeshStandardMaterial({ color:COLORS[k], roughness:0.3, metalness:0.05 });

const cubies = [], stickers = [];
for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
  if (!x && !y && !z) continue;
  const c = new THREE.Mesh(bodyGeo, bodyMat);
  c.position.set(x, y, z);
  c.userData.home = c.position.clone();
  for (const [face, v] of FACES) {
    const n = new V3(...v);
    if (n.dot(c.position) !== 1) continue;
    const s = new THREE.Mesh(stickerGeo, mats[face]);
    s.position.copy(n).multiplyScalar(0.485);
    s.quaternion.setFromUnitVectors(new V3(0,0,1), n);
    s.userData = { face, normal:n };
    c.add(s);
    stickers.push(s);
  }
  root.add(c);
  cubies.push(c);
}

// --- Moves ---
// Face turn = [axis, layer, direction]; direction +1 is +90° around the axis.
const FACE_MOVES = { R:['x',1,-1], L:['x',-1,1], U:['y',1,-1], D:['y',-1,1], F:['z',1,-1], B:['z',-1,1] };
const queue = [];
let anim = null, moves = 0, playing = false;

function enqueue(axis, layer, dir, scramble = false) {
  queue.push({ axis, layer, dir, scramble, duration: reduceMotion ? 1 : (scramble ? 90 : 260) });
  startNext();
}
function faceTurn(face, prime) {
  const [a, l, d] = FACE_MOVES[face];
  enqueue(a, l, prime ? -d : d);
}
function startNext() {
  if (anim || !queue.length) return;
  const m = queue.shift();
  const k = IDX[m.axis];
  const set = cubies
    .filter(c => Math.round(c.position.getComponent(k)) === m.layer)
    .map(c => ({ c, p:c.position.clone(), q:c.quaternion.clone() }));
  anim = { ...m, set, t0:performance.now() };
}
const SNAP = [0, 0.5, Math.SQRT1_2, 1];
function snapValue(v) {
  const a = Math.abs(v);
  let best = 0;
  for (const s of SNAP) if (Math.abs(a - s) < Math.abs(a - best)) best = s;
  return Math.sign(v) * best;
}
function snap(c) {
  c.position.round();
  const q = c.quaternion;
  q.set(snapValue(q.x), snapValue(q.y), snapValue(q.z), snapValue(q.w)).normalize();
}
function stepAnim(now) {
  if (!anim) return;
  const t = Math.min(1, (now - anim.t0) / anim.duration);
  const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const q = new Q().setFromAxisAngle(AX[anim.axis], anim.dir * Math.PI / 2 * e);
  for (const s of anim.set) {
    s.c.position.copy(s.p).applyQuaternion(q);
    s.c.quaternion.copy(s.q).premultiply(q);
  }
  if (t < 1) return;
  anim.set.forEach(s => snap(s.c));
  const done = anim;
  anim = null;
  if (!done.scramble && playing) moves++;
  startNext();
  if (!anim) updateStatus();
}
function isSolved() {
  const seen = {}, n = new V3();
  for (const s of stickers) {
    n.copy(s.userData.normal).applyQuaternion(s.parent.quaternion).round();
    const key = `${n.x},${n.y},${n.z}`;
    if (seen[key] === undefined) seen[key] = s.userData.face;
    else if (seen[key] !== s.userData.face) return false;
  }
  return true;
}
function updateStatus() {
  if (!playing) return;
  if (moves > 0 && isSolved()) {
    playing = false;
    statusEl.textContent = `Solved in ${moves} move${moves === 1 ? '' : 's'}!`;
    statusEl.classList.add('solved');
  } else {
    statusEl.textContent = `${moves} move${moves === 1 ? '' : 's'}`;
    statusEl.classList.remove('solved');
  }
}
function finishNow() {
  queue.length = 0;
  if (anim) { anim.t0 = -1e9; stepAnim(performance.now()); }
}
function scramble() {
  finishNow();
  const faces = Object.keys(FACE_MOVES);
  let last = '';
  for (let i = 0; i < 25; i++) {
    let f;
    do f = faces[Math.floor(Math.random() * 6)]; while (f === last);
    last = f;
    const [a, l, d] = FACE_MOVES[f];
    const r = Math.random();
    enqueue(a, l, r < 0.5 ? d : -d, true);
    if (r > 0.85) enqueue(a, l, d, true); // occasional double turn
  }
  moves = 0;
  playing = true;
  statusEl.textContent = 'Scrambling…';
  statusEl.classList.remove('solved');
}
function reset() {
  finishNow();
  for (const c of cubies) { c.position.copy(c.userData.home); c.quaternion.identity(); }
  moves = 0;
  playing = false;
  statusEl.textContent = 'Solved. Press Scramble to start.';
  statusEl.classList.remove('solved');
}

// --- Pointer: drag a sticker to turn, drag background to orbit ---
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let drag = null;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(stickers, false)[0] || null;
  drag = { x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, hit, done:false };
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.hit) {
    if (drag.done) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) < 12) return;
    drag.done = true;
    if (!anim && !queue.length) turnFromDrag(drag.hit, dx, dy);
  } else {
    const qy = new Q().setFromAxisAngle(AX.y, (e.clientX - drag.lx) * 0.008);
    const qx = new Q().setFromAxisAngle(AX.x, (e.clientY - drag.ly) * 0.008);
    root.quaternion.premultiply(qy).premultiply(qx);
    stars.quaternion.premultiply(new Q().slerp(qy, 0.3)).premultiply(new Q().slerp(qx, 0.3));
    drag.lx = e.clientX; drag.ly = e.clientY;
  }
});
const endDrag = () => { drag = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function turnFromDrag(hit, dx, dy) {
  const c = hit.object.parent;
  const n = hit.object.userData.normal.clone().applyQuaternion(c.quaternion).round();
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const p1 = hit.point.clone().project(camera);
  let best = null;
  for (const a of ['x', 'y', 'z']) {
    if (Math.abs(AX[a].dot(n)) > 0.5) continue;
    // Direction the sticker moves on screen for a +90° turn around axis a.
    const t = new V3().crossVectors(AX[a], n).applyQuaternion(root.quaternion);
    const p2 = hit.point.clone().add(t).project(camera);
    const sx = (p2.x - p1.x) * w / 2, sy = -(p2.y - p1.y) * h / 2;
    const d = (dx * sx + dy * sy) / (Math.hypot(sx, sy) || 1);
    if (!best || Math.abs(d) > Math.abs(best.d)) best = { a, d };
  }
  const layer = Math.round(c.position.getComponent(IDX[best.a]));
  enqueue(best.a, layer, Math.sign(best.d));
}

// --- Buttons & keys ---
const pad = document.getElementById('pad');
for (const prime of [false, true]) for (const f of ['U','D','L','R','F','B']) {
  const b = document.createElement('button');
  b.textContent = f + (prime ? '′' : '');
  b.setAttribute('aria-label', `Turn ${f}${prime ? ' prime' : ''}`);
  b.onclick = () => faceTurn(f, prime);
  pad.appendChild(b);
}
document.getElementById('scramble').onclick = scramble;
document.getElementById('reset').onclick = reset;
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const f = e.key.toUpperCase();
  if (FACE_MOVES[f]) { faceTurn(f, e.shiftKey); e.preventDefault(); }
});

// --- Sizing & loop ---
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.position.set(0, 0, Math.max(11, 9.5 / camera.aspect));
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();
(function loop(now) {
  stepAnim(now);
  if (!reduceMotion) stars.rotation.y += 0.0003;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
</html>
